saveExact: true

packages:
  - apps/*
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  esbuild: true

catalogs:
  dev:
    typescript: 6.0.3
    dotenv: 17.4.2
  prod:
    nuxt: 4.4.8
  db:
    drizzle-orm: 1.0.0-rc.3
    drizzle-kit: 1.0.0-rc.3
    "@neondatabase/serverless": 1.1.0
    pg: 8.22.0
  types:
    "@types/node": 26.0.0
  fmt:
    oxfmt: 0.55.0
  lint:
    oxlint: 1.70.0
    oxlint-tsgolint: 0.23.0
  hooks:
    husky: 9.1.7
    lint-staged: 17.0.7

publicHoistPattern:
  - vue
  - vue-router
