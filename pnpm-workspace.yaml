packages:
  - apps/*
  - packages/*
allowBuilds:
  "@parcel/watcher": true
  esbuild: true

catalogs:
  dev:
    typescript: ^6.0.3
    dotenv: ^17.4.2
  prod:
    nuxt: ^4.4.6
  db:
    drizzle-orm: ^1.0.0-rc.4
    drizzle-kit: ^1.0.0-rc.4
    "@neondatabase/serverless": ^1.1.0
    pg: ^8.21.0
  types:
    "@types/node": ^25.9.1
  fmt:
    oxfmt: ^0.51.0
  lint:
    oxlint: ^1.66.0
    oxlint-tsgolint: ^0.23.0
  hooks:
    husky: ^9.1.7
    lint-staged: ^17.0.5

publicHoistPattern:
  - vue
  - vue-router
