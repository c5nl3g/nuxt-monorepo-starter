packages:
  - apps/*
  - packages/*
allowBuilds:
  "@parcel/watcher": true
  esbuild: true

catalogs:
  dev:
    typescript: ^6.0.3
    dotenv: ^17.4.2
  prod:
    nuxt: ^4.4.5
  db:
    drizzle-orm: ^1.0.0-rc.2
    drizzle-kit: ^1.0.0-rc.2
    "@neondatabase/serverless": ^1.1.0
    pg: ^8.20.0
  types:
    "@types/node": ^25.7.0
  fmt:
    oxfmt: ^0.49.0
  lint:
    oxlint: ^1.64.0
    oxlint-tsgolint: ^0.22.1
  hooks:
    husky: ^9.1.7
    lint-staged: ^17.0.4

publicHoistPattern:
  - vue
  - vue-router
